<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortrust 静态资源中心</title>
<meta name="description" content="Fortrust 产品原型、H5 页面、设计稿、需求文档与附件统一入口">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><circle cx='12' cy='12' r='10'/></svg>">
<style>
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --primary-light: #eff6ff;
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --border-hover: #cbd5e1;
  --green: #059669;
  --green-light: #ecfdf5;
  --amber: #d97706;
  --amber-light: #fffbeb;
  --danger: #ef4444;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text-main);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  line-height:1.5;
}
.container{
  width:min(1160px,calc(100% - 36px));
  margin:0 auto;
}

/* Auth Lockscreen Overlay */
.auth-overlay{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
  backdrop-filter:blur(10px);
}
.auth-box{
  background:#ffffff;
  border-radius:18px;
  width:min(440px, 100%);
  padding:36px 32px;
  box-shadow:0 25px 50px -12px rgba(0, 0, 0, 0.45);
  text-align:center;
  animation:authFadeIn .25s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes authFadeIn {
  0% { transform: scale(0.92); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.auth-icon{
  width:56px;
  height:56px;
  border-radius:16px;
  background:var(--primary-light);
  color:var(--primary);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  margin-bottom:18px;
}
.auth-title{
  font-size:22px;
  font-weight:800;
  color:#0f172a;
  margin-bottom:8px;
  letter-spacing:-0.02em;
}
.auth-desc{
  font-size:13px;
  color:var(--text-muted);
  margin-bottom:24px;
  line-height:1.6;
}
.auth-input-group{
  position:relative;
  margin-bottom:14px;
}
.auth-input{
  width:100%;
  padding:13px 16px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:15px;
  outline:none;
  transition:all .15s ease;
  background:#f8fafc;
}
.auth-input:focus{
  background:#ffffff;
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37, 99, 235, 0.15);
}
.auth-error{
  color:var(--danger);
  font-size:12px;
  font-weight:600;
  margin-bottom:14px;
  min-height:18px;
  display:none;
}
.auth-btn{
  width:100%;
  padding:13px;
  background:var(--primary);
  color:#ffffff;
  border:none;
  border-radius:10px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:background .15s ease, transform .1s ease;
}
.auth-btn:hover{
  background:var(--primary-hover);
}
.auth-btn:active{
  transform:scale(0.99);
}
.auth-hint{
  font-size:12px;
  color:#94a3b8;
  margin-top:16px;
}

/* App Header & Layout */
.hero{
  padding:44px 0 20px;
}
.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--primary);
  font-size:13px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  background:var(--primary-light);
  padding:4px 12px;
  border-radius:20px;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--primary);
}
.logout-btn{
  display:inline-flex;
  align-items:center;
  gap:4px;
  background:none;
  border:1px solid var(--border);
  border-radius:8px;
  padding:4px 10px;
  font-size:12px;
  color:var(--text-muted);
  cursor:pointer;
  transition:all .15s ease;
}
.logout-btn:hover{
  border-color:var(--danger);
  color:var(--danger);
  background:#fef2f2;
}
h1{
  font-size:34px;
  font-weight:800;
  line-height:1.2;
  margin:14px 0 8px;
  color:var(--text-main);
  letter-spacing:-.02em;
}
.sub{
  margin:0;
  color:var(--text-muted);
  font-size:14px;
}
.toolbar{
  margin:24px 0 20px;
  display:flex;
  gap:12px;
}
.search-box{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
}
.search{
  width:100%;
  padding:12px 40px 12px 16px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  background:#fff;
  outline:0;
  font-size:14px;
  color:var(--text-main);
  transition:all .15s ease;
}
.search:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.15);
}
.search-clear{
  position:absolute;
  right:12px;
  background:none;
  border:none;
  color:#94a3b8;
  font-size:14px;
  cursor:pointer;
  display:none;
  padding:4px;
  border-radius:50%;
}
.search-clear:hover{
  color:#475569;
}
.count{
  display:flex;
  align-items:center;
  padding:0 16px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  color:var(--text-muted);
  font-size:13px;
  font-weight:500;
  white-space:nowrap;
}
.main-content{
  flex:1;
  padding-bottom:60px;
}
.tree{
  display:flex;
  flex-direction:column;
  gap:16px;
}
.card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  transition:border-color .15s, box-shadow .15s;
}
.card:hover{
  border-color:var(--border-hover);
  box-shadow:0 4px 12px rgba(0,0,0,.03);
}
.folder-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px;
  background:#f8fafc;
  border-bottom:1px solid #f1f5f9;
  gap:12px;
}
.folder-title-area{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  flex:1;
}
.folder-icon{
  font-size:18px;
  line-height:1;
}
.folder-name{
  font-size:15px;
  font-weight:700;
  color:var(--text-main);
  overflow-wrap:anywhere;
}
.badge{
  font-size:11px;
  font-weight:600;
  padding:2px 8px;
  border-radius:12px;
  background:#e2e8f0;
  color:#475569;
  white-space:nowrap;
}
.file-list{
  padding:6px 0;
  display:flex;
  flex-direction:column;
}
.file-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 18px;
  gap:12px;
  transition:background-color .12s;
  color:inherit;
  border-bottom:1px solid #f8fafc;
}
.file-item:last-child{
  border-bottom:none;
}
.file-item:hover{
  background:#f8fafc;
}
.file-info{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  flex:1;
}
.file-icon{
  font-size:16px;
}
.file-name{
  font-size:14px;
  font-weight:600;
  color:#334155;
  overflow-wrap:anywhere;
}
.file-meta-group{
  display:inline-flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}
.file-tag{
  font-size:11px;
  color:#64748b;
  background:#f1f5f9;
  padding:2px 6px;
  border-radius:4px;
  white-space:nowrap;
}
.file-size{
  font-size:11px;
  color:#94a3b8;
  white-space:nowrap;
}
.action-group{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.btn-copy{
  padding:6px 10px;
  border-radius:6px;
  border:1px solid var(--border);
  background:#fff;
  color:#64748b;
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  transition:all .15s ease;
  white-space:nowrap;
}
.btn-copy:hover{
  border-color:var(--primary);
  color:var(--primary);
}
.btn-action{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:6px 14px;
  border-radius:6px;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
  white-space:nowrap;
  transition:all .15s ease;
  cursor:pointer;
  border:none;
}
/* 新标签打开 (HTML) */
.btn-open{
  background:var(--primary-light);
  color:var(--primary);
}
.btn-open:hover{
  background:var(--primary);
  color:#fff;
}
/* 弹窗预览 (PDF, 图片, 视频等) */
.btn-preview{
  background:var(--green-light);
  color:var(--green);
}
.btn-preview:hover{
  background:var(--green);
  color:#fff;
}
/* 启动下载 (Office, 压缩包等) */
.btn-download{
  background:var(--amber-light);
  color:var(--amber);
}
.btn-download:hover{
  background:var(--amber);
  color:#fff;
}
.children-section{
  padding:12px 18px 16px;
  background:#fbfcfe;
  border-top:1px dashed var(--border);
}
.empty,.loading{
  padding:36px;
  text-align:center;
  color:#94a3b8;
  background:#fff;
  border:1px dashed #cbd5e1;
  border-radius:12px;
  font-size:14px;
}

/* Modal Preview Component */
.modal-overlay{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:rgba(15, 23, 42, 0.7);
  backdrop-filter:blur(6px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:20px;
  opacity:0;
  transition:opacity .2s ease;
}
.modal-overlay.active{
  display:flex;
  opacity:1;
}
.modal-box{
  background:#ffffff;
  border-radius:14px;
  width:min(1080px, 94vw);
  height:min(860px, 88vh);
  display:flex;
  flex-direction:column;
  box-shadow:0 25px 50px -12px rgba(0, 0, 0, 0.35);
  overflow:hidden;
  animation:modalScale .2s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes modalScale {
  0% { transform: scale(0.95); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 20px;
  border-bottom:1px solid var(--border);
  background:#f8fafc;
  gap:12px;
}
.modal-title-area{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.modal-title{
  font-size:15px;
  font-weight:700;
  color:#0f172a;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.modal-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.modal-btn{
  padding:6px 12px;
  border-radius:6px;
  font-size:12px;
  font-weight:600;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:4px;
  border:1px solid var(--border);
  background:#ffffff;
  color:#475569;
  cursor:pointer;
  transition:all .15s ease;
}
.modal-btn:hover{
  border-color:var(--primary);
  color:var(--primary);
}
.modal-close{
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  border:none;
  background:none;
  color:#64748b;
  font-size:18px;
  cursor:pointer;
  transition:background .15s;
}
.modal-close:hover{
  background:#e2e8f0;
  color:#0f172a;
}
.modal-body{
  flex:1;
  background:#f1f5f9;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.modal-body iframe{
  width:100%;
  height:100%;
  border:none;
}
.modal-body img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  padding:16px;
}
.modal-body video{
  max-width:100%;
  max-height:100%;
  border-radius:8px;
  outline:none;
}
.modal-body pre{
  width:100%;
  height:100%;
  overflow:auto;
  margin:0;
  padding:20px;
  background:#0f172a;
  color:#f8fafc;
  font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
  font-size:13px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-all;
}

/* Toast Notification */
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#1e293b;
  color:#fff;
  padding:10px 20px;
  border-radius:8px;
  font-size:13px;
  font-weight:500;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
  transition:transform .2s cubic-bezier(0.16, 1, 0.3, 1), opacity .2s;
  opacity:0;
  z-index:10000;
  pointer-events:none;
}
.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}
footer{
  border-top:1px solid var(--border);
  padding:20px 0;
  color:#94a3b8;
  font-size:12px;
  text-align:center;
  background:#fff;
}
@media(max-width:650px){
  .hero{padding-top:28px}
  h1{font-size:26px}
  .toolbar{flex-direction:column}
  .count{height:38px;justify-content:center}
  .folder-header{padding:12px 14px}
  .file-item{padding:10px 14px;flex-wrap:wrap}
  .action-group{width:100%;justify-content:flex-end;margin-top:6px}
  .file-meta-group{display:none}
  .modal-box{width:98vw;height:92vh}
}
</style>
</head>
<body>

<!-- Password Authentication Lockscreen -->
<div id="authOverlay" class="auth-overlay">
  <div class="auth-box">
    <h2 class="auth-title" style="margin-bottom: 22px;">🔐 请输入访问密钥</h2>
    
    <div class="auth-input-group">
      <input type="password" id="authPassword" class="auth-input" placeholder="请输入访问密钥..." autocomplete="current-password">
    </div>
    <div id="authError" class="auth-error">密钥错误，请重新输入</div>
    
    <button id="authBtn" class="auth-btn" onclick="submitAuth()">确认进入</button>
  </div>
</div>

<!-- Main App Content -->
<div id="appRoot" style="display:none; flex-direction:column; min-height:100vh;">
  <header class="hero">
    <div class="container">
      <div class="header-top">
        <div class="brand"><span class="dot"></span>FORTRUST</div>
        <button class="logout-btn" onclick="logout()" title="清除登录状态">🔒 锁定退出</button>
      </div>
      <h1>静态资源中心</h1>
      <p class="sub">产品原型、H5 页面、设计稿、需求文档与附件统一入口 · 由 Cloudflare Pages 自动构建发布</p>
      <div class="toolbar">
        <div class="search-box">
          <input id="search" class="search" placeholder="搜索目录名称或页面文件… (快捷键 /)" autocomplete="off">
          <button id="searchClear" class="search-clear" title="清空搜索">✕</button>
        </div>
        <div id="count" class="count">加载中…</div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div id="tree" class="tree"><div class="loading">正在读取项目目录…</div></div>
    </div>
  </main>

  <!-- Modal Preview -->
  <div id="previewModal" class="modal-overlay" onclick="closePreviewOnBackdrop(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title-area">
          <span id="modalIcon" style="font-size: 20px;">📄</span>
          <span id="modalTitle" class="modal-title">预览文件</span>
          <span id="modalTag" class="file-tag" style="margin-left: 4px;">PDF</span>
        </div>
        <div class="modal-actions">
          <a id="modalNewTab" class="modal-btn" href="#" target="_blank" rel="noopener noreferrer">新标签打开 ↗</a>
          <a id="modalDownload" class="modal-btn" href="#" download>下载 ⤓</a>
          <button class="modal-close" onclick="closePreview()" title="关闭 (Esc)">✕</button>
        </div>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <footer>
    <div class="container">
      <span>Fortrust Static Resource Center · Cloudflare Pages</span>
      <span id="buildTimeText" style="margin-left: 8px; opacity: 0.8;"></span>
    </div>
  </footer>
</div>

<div id="toast" class="toast">已复制直观链接</div>

<script>
// ==========================================
// 密码验证与 7 天有效期配置
// ==========================================
const AUTH_CONFIG = {
  // 访问密码（支持自定义修改）
  PASSWORDS: ['fortrust', 'fortrust2026', 'fortrust888'],
  STORAGE_KEY: 'fortrust_auth_session_v1',
  EXPIRE_MS: 7 * 24 * 60 * 60 * 1000 // 7 天
};

const authOverlay = document.getElementById('authOverlay');
const authPasswordInput = document.getElementById('authPassword');
const authError = document.getElementById('authError');
const authBtn = document.getElementById('authBtn');
const appRoot = document.getElementById('appRoot');

function checkAuthStatus() {
  try {
    const raw = localStorage.getItem(AUTH_CONFIG.STORAGE_KEY);
    if (!raw) return false;
    const session = JSON.parse(raw);
    if (session && session.authed && session.expiresAt && session.expiresAt > Date.now()) {
      return true;
    }
  } catch(e) {}
  localStorage.removeItem(AUTH_CONFIG.STORAGE_KEY);
  return false;
}

function submitAuth() {
  const pwd = authPasswordInput.value.trim();
  if (!pwd) {
    showAuthError('请输入访问密钥');
    return;
  }

  if (AUTH_CONFIG.PASSWORDS.includes(pwd)) {
    // 验证成功，写入 7 天有效期
    const sessionData = {
      authed: true,
      expiresAt: Date.now() + AUTH_CONFIG.EXPIRE_MS,
      loginAt: new Date().toISOString()
    };
    localStorage.setItem(AUTH_CONFIG.STORAGE_KEY, JSON.stringify(sessionData));
    unlockApp();
  } else {
    showAuthError('密钥错误，请重新输入');
    authPasswordInput.focus();
    authPasswordInput.select();
  }
}

function showAuthError(msg) {
  authError.textContent = msg;
  authError.style.display = 'block';
}

function unlockApp() {
  authOverlay.style.display = 'none';
  appRoot.style.display = 'flex';
  load(); // 加载目录数据
}

function logout() {
  localStorage.removeItem(AUTH_CONFIG.STORAGE_KEY);
  window.location.reload();
}

authPasswordInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    submitAuth();
  }
  authError.style.display = 'none';
});

// ==========================================
// 页面主逻辑与渲染
// ==========================================
const treeEl = document.getElementById('tree');
const searchEl = document.getElementById('search');
const clearBtn = document.getElementById('searchClear');
const countEl = document.getElementById('count');
const toastEl = document.getElementById('toast');
const buildTimeEl = document.getElementById('buildTimeText');

// Modal Elements
const modalOverlay = document.getElementById('previewModal');
const modalIcon = document.getElementById('modalIcon');
const modalTitle = document.getElementById('modalTitle');
const modalTag = document.getElementById('modalTag');
const modalNewTab = document.getElementById('modalNewTab');
const modalDownload = document.getElementById('modalDownload');
const modalBody = document.getElementById('modalBody');

let data = [];

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2000);
}

function copyUrl(e, url) {
  e.preventDefault();
  e.stopPropagation();
  const readablePath = decodeURIComponent(url);
  const fullUrl = window.location.origin + readablePath;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(fullUrl).then(() => showToast('已复制直观链接'));
  } else {
    const input = document.createElement('input');
    input.value = fullUrl;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
    showToast('已复制直观链接');
  }
}

function esc(s){
  return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function openPreview(fileJsonStr) {
  const f = typeof fileJsonStr === 'string' ? JSON.parse(decodeURIComponent(fileJsonStr)) : fileJsonStr;
  modalIcon.textContent = f.icon || '📄';
  modalTitle.textContent = f.title || f.fileName;
  modalTag.textContent = (f.typeLabel || '') + (f.size ? ` · ${f.size}` : '');
  modalNewTab.href = f.url;
  modalDownload.href = f.url;
  modalDownload.setAttribute('download', f.fileName);

  modalBody.innerHTML = '<div style="color:#64748b;font-size:14px;">正在加载预览…</div>';
  modalOverlay.classList.add('active');

  const cat = f.category;
  if (cat === 'image') {
    modalBody.innerHTML = `<img src="${f.url}" alt="${esc(f.title)}">`;
  } else if (cat === 'pdf') {
    modalBody.innerHTML = `<iframe src="${f.url}#toolbar=1" type="application/pdf"></iframe>`;
  } else if (cat === 'video') {
    modalBody.innerHTML = `<video src="${f.url}" controls autoplay playsinline></video>`;
  } else if (cat === 'audio') {
    modalBody.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;width:100%;"><audio src="${f.url}" controls autoplay style="width:min(480px,80%);"></audio></div>`;
  } else if (cat === 'text') {
    try {
      const res = await fetch(f.url);
      const txt = await res.text();
      modalBody.innerHTML = `<pre>${esc(txt)}</pre>`;
    } catch(err) {
      modalBody.innerHTML = `<div style="color:#ef4444;font-size:14px;">加载文本内容失败，请在新标签页打开。</div>`;
    }
  } else {
    modalBody.innerHTML = `<iframe src="${f.url}"></iframe>`;
  }
}

function closePreview() {
  modalOverlay.classList.remove('active');
  modalBody.innerHTML = '';
}

function closePreviewOnBackdrop(e) {
  if (e.target === modalOverlay) {
    closePreview();
  }
}

function filterTree(nodes, q){
  const res = [];
  for(const node of nodes){
    const matchSelf = node.name.toLowerCase().includes(q);
    const matchedFiles = (node.files || []).filter(f => 
      f.title.toLowerCase().includes(q) || 
      f.fileName.toLowerCase().includes(q) ||
      (f.typeLabel && f.typeLabel.toLowerCase().includes(q))
    );
    const matchedChildren = filterTree(node.children || [], q);

    if(matchSelf){
      res.push(node);
    } else if(matchedFiles.length > 0 || matchedChildren.length > 0){
      res.push({
        ...node,
        files: matchedFiles.length > 0 ? matchedFiles : node.files,
        children: matchedChildren
      });
    }
  }
  return res;
}

function getStats(nodes){
  let folders = 0;
  let files = 0;
  function traverse(list){
    for(const n of list){
      folders++;
      files += (n.files || []).length;
      if(n.children && n.children.length) traverse(n.children);
    }
  }
  traverse(nodes);
  return { folders, files };
}

function renderActionButton(f) {
  const fJson = encodeURIComponent(JSON.stringify(f));
  if (f.actionType === 'new_tab') {
    return `<a class="btn-action btn-open" href="${f.url}" target="_blank" rel="noopener noreferrer">新标签打开 ↗</a>`;
  }
  if (f.actionType === 'preview') {
    return `<button class="btn-action btn-preview" onclick="openPreview('${fJson}')">预览</button>`;
  }
  return `<a class="btn-action btn-download" href="${f.url}" download="${esc(f.fileName)}">启动下载 ⤓</a>`;
}

function renderNode(node){
  const files = node.files || [];
  const children = node.children || [];
  
  let filesHtml = '';
  if(files.length > 0){
    filesHtml = `<div class="file-list">
      ${files.map(f => `
        <div class="file-item">
          <div class="file-info">
            <span class="file-icon">${f.icon || '📄'}</span>
            <span class="file-name">${esc(f.title)}</span>
            <div class="file-meta-group">
              <span class="file-tag">${esc(f.typeLabel || f.fileName)}</span>
              ${f.size ? `<span class="file-size">${esc(f.size)}</span>` : ''}
            </div>
          </div>
          <div class="action-group">
            <button class="btn-copy" onclick="copyUrl(event, '${f.url}')">复制链接</button>
            ${renderActionButton(f)}
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  let childrenHtml = '';
  if(children.length > 0){
    childrenHtml = `<div class="children-section">
      <div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:10px;">子目录：</div>
      <div class="tree" style="gap:10px;">
        ${children.map(renderNode).join('')}
      </div>
    </div>`;
  }

  return `<div class="card">
    <div class="folder-header">
      <div class="folder-title-area">
        <span class="folder-icon">📁</span>
        <span class="folder-name">${esc(node.name)}</span>
      </div>
      <span class="badge">${files.length} 个资源</span>
    </div>
    ${filesHtml}
    ${childrenHtml}
  </div>`;
}

function render(nodes){
  if(!nodes || !nodes.length){
    treeEl.innerHTML = '<div class="empty">没有找到匹配的项目或文件</div>';
    countEl.textContent = '0 个资源';
    return;
  }
  const stats = getStats(nodes);
  treeEl.innerHTML = nodes.map(renderNode).join('');
  countEl.textContent = `${stats.folders} 个项目 · ${stats.files} 个文件`;
}

async function load(){
  try{
    const res = await fetch('./directory.json?ts=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('directory.json HTTP ' + res.status);
    const raw = await res.json();
    data = Array.isArray(raw) ? raw : (raw.data || []);
    if(raw.buildTime) {
      const d = new Date(raw.buildTime);
      buildTimeEl.textContent = `· 构建于 ${d.toLocaleDateString()} ${d.toLocaleTimeString()}`;
    }
    render(data);
  }catch(e){
    treeEl.innerHTML = '<div class="empty">目录读取失败，请确认 Cloudflare 构建已生成 directory.json。</div>';
    countEl.textContent = '读取失败';
    console.error(e);
  }
}

searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  clearBtn.style.display = q ? 'block' : 'none';
  render(q ? filterTree(data, q) : data);
});

clearBtn.addEventListener('click', () => {
  searchEl.value = '';
  clearBtn.style.display = 'none';
  render(data);
  searchEl.focus();
});

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') {
    if(modalOverlay.classList.contains('active')) {
      closePreview();
    } else if(document.activeElement === searchEl) {
      searchEl.value = '';
      clearBtn.style.display = 'none';
      render(data);
      searchEl.blur();
    }
  } else if(e.key === '/' && document.activeElement !== searchEl && !modalOverlay.classList.contains('active')) {
    e.preventDefault();
    searchEl.focus();
  }
});

// 初始化启动检查
if (checkAuthStatus()) {
  unlockApp();
} else {
  authOverlay.style.display = 'flex';
  appRoot.style.display = 'none';
  setTimeout(() => authPasswordInput.focus(), 100);
}
</script>
