<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortrust 静态资源中心</title>
<meta name="description" content="Fortrust 产品原型、H5、Demo 静态资源导航中心">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#f5f7fb;color:#172033}
.container{width:min(1120px,calc(100% - 32px));margin:auto}
.hero{padding:58px 0 28px}
.brand{display:flex;align-items:center;gap:9px;color:#2563eb;font-size:13px;font-weight:800;letter-spacing:.08em}
.dot{width:9px;height:9px;border-radius:50%;background:#2563eb}
h1{font-size:42px;line-height:1.15;margin:13px 0 10px;letter-spacing:-.035em}
.sub{margin:0;color:#64748b;font-size:15px}
.toolbar{margin:28px 0 22px;display:flex;gap:12px}
.search{flex:1;padding:13px 15px;border:1px solid #dbe2ea;border-radius:11px;background:#fff;outline:0;font-size:14px}
.search:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}
.count{display:flex;align-items:center;padding:0 14px;border:1px solid #e2e8f0;border-radius:11px;background:#fff;color:#64748b;font-size:13px;white-space:nowrap}
.tree{padding-bottom:52px}
.group{margin:12px 0}
.row{display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 14px;background:#fff;border:1px solid #e2e8f0;border-radius:12px}
.row:hover{border-color:#bfdbfe}
.folder{font-size:18px}
.name{font-weight:650;flex:1;min-width:0;overflow-wrap:anywhere}
.meta{font-size:12px;color:#94a3b8}
.open{padding:7px 11px;border-radius:8px;background:#eff6ff;color:#2563eb;text-decoration:none;font-size:13px;font-weight:650;white-space:nowrap}
.open:hover{background:#dbeafe}
.children{margin-left:28px;padding-left:15px;border-left:1px solid #dbe2ea}
.empty,.loading{padding:28px;text-align:center;color:#94a3b8;background:#fff;border:1px dashed #dbe2ea;border-radius:12px}
footer{border-top:1px solid #e2e8f0;padding:20px 0 30px;color:#94a3b8;font-size:12px}
@media(max-width:650px){.hero{padding-top:38px}h1{font-size:32px}.toolbar{flex-direction:column}.count{height:42px;justify-content:center}.children{margin-left:12px;padding-left:10px}.meta{display:none}}
</style>
</head>
<body>
<header class="hero">
  <div class="container">
    <div class="brand"><span class="dot"></span>FORTRUST</div>
    <h1>静态资源中心</h1>
    <p class="sub">产品原型、H5 页面、前端 Demo 与静态资源统一入口。目录由 GitHub 构建时自动扫描。</p>
    <div class="toolbar">
      <input id="search" class="search" placeholder="搜索项目名称…" autocomplete="off">
      <div id="count" class="count">加载中…</div>
    </div>
  </div>
</header>

<main class="container">
  <div id="tree" class="tree"><div class="loading">正在读取项目目录…</div></div>
</main>

<footer><div class="container">Fortrust Static Resource Center · Cloudflare Pages</div></footer>

<script>
const treeEl=document.getElementById('tree');
const searchEl=document.getElementById('search');
const countEl=document.getElementById('count');
let data=[];

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function filterNode(node,q){
  const self=node.name.toLowerCase().includes(q);
  const children=(node.children||[]).map(x=>filterNode(x,q)).filter(Boolean);
  if(self||children.length){return {...node,children};}
  return null;
}

function countNodes(nodes){
  return nodes.reduce((n,x)=>n+1+countNodes(x.children||[]),0);
}

function render(nodes){
  if(!nodes.length){treeEl.innerHTML='<div class="empty">没有找到匹配的项目</div>';countEl.textContent='0 个项目';return;}
  treeEl.innerHTML=nodes.map(renderNode).join('');
  countEl.textContent=countNodes(nodes)+' 个目录';
}

function renderNode(node){
  const children=node.children||[];
  const href=node.hasIndex ? node.url : '';
  const action=href ? `<a class="open" href="${href}">查看 →</a>` : '';
  return `<div class="group">
    <div class="row">
      <span class="folder">📁</span>
      <span class="name">${esc(node.name)}</span>
      <span class="meta">${node.hasIndex?'可访问':'子目录'}</span>
      ${action}
    </div>
    ${children.length?`<div class="children">${children.map(renderNode).join('')}</div>`:''}
  </div>`;
}

async function load(){
  try{
    const res=await fetch('./directory.json?ts='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('directory.json HTTP '+res.status);
    data=await res.json();
    render(data);
  }catch(e){
    treeEl.innerHTML='<div class="empty">目录读取失败，请确认 Cloudflare 构建脚本已执行并生成 directory.json。</div>';
    countEl.textContent='读取失败';
    console.error(e);
  }
}

searchEl.addEventListener('input',()=>{
  const q=searchEl.value.trim().toLowerCase();
  render(q?data.map(x=>filterNode(x,q)).filter(Boolean):data);
});
load();
</script>
</body>
</html>
